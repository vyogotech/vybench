name: Build & Publish Frappista Snap

on:
  push:
    branches: [main, develop, version-16]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop, version-16]
  workflow_dispatch:

jobs:
  build:
    name: Build Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up LXD
        run: |
          sudo apt-get install -y snapd
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd $USER
          newgrp lxd

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          snapcraft pack --use-lxd --verbosity=verbose
        env:
          SNAPCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "1"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: frappista-${{ matrix.arch }}.snap
          path: "*.snap"
          retention-days: 30

  publish:
    name: Publish to Snap Store
    runs-on: ubuntu-24.04
    needs: build
    # Only publish on version tags (e.g. v16.0.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download amd64 snap
        uses: actions/download-artifact@v4
        with:
          name: frappista-amd64.snap

      - name: Download arm64 snap
        uses: actions/download-artifact@v4
        with:
          name: frappista-arm64.snap

      - name: Publish to Snap Store (edge channel)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: frappista_*_amd64.snap
          release: edge

      - name: Promote to stable on release tag
        if: "!contains(github.ref, '-')"   # not a pre-release tag
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: frappista_*_amd64.snap
          release: stable

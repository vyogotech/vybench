name: Build and Release Snap, DEB & RPM Packages

# Deliberately NOT triggered on push or pull_request.
#
# One full matrix run is ~100+ minutes of runner time: each payload build
# compiles CPython 3.14 from source, runs `bench init`, and builds the frontend
# assets. On a PRIVATE repository those minutes are metered (2,000/month on Free,
# 3,000 on Team), so a push trigger exhausts the monthly quota in a few days of
# normal work — and nobody needs a 40-minute ERPNext build to review a one-line
# change.
#
# Build on tags, or on demand. For iterating on the packaging itself, run
# scripts/build-bench-payload.sh locally; it is the same code path.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version (e.g. 16.0.0)'
        required: false
        default: '16.0.0'
      publish_snap_store:
        description: 'Publish Snap to Canonical Snap Store'
        type: boolean
        required: false
        default: false

jobs:
  # The snap is one artefact for every distribution, because it bundles python,
  # OpenSSL and everything else. The native packages below cannot be: their
  # virtualenv links against the target distribution's python, so the matrix is
  # per distro release, not per architecture alone.
  build-native:
    name: ${{ matrix.distro }} (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only what has been verified end to end. The RPM path builds a valid
        # package and its Rocky 9 payload builds clean, but no .rpm has yet been
        # installed and exercised in a live container -- adding it here would ship
        # a red build. Re-add rockylinux:9 (and a CURRENT fedora; 41 is EOL) once
        # scripts/test-native-package.sh passes against a real .rpm.
        include:
          - distro: ubuntu:24.04
            format: deb
          - distro: debian:12
            format: deb
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Version Variable
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="16.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo '${{ matrix.distro }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"

      # Builds the bench at /opt/frappe-bench inside a container of the target
      # distribution. Building at the final install path is what keeps the venv
      # shebangs, pyvenv.cfg and the sites/assets symlinks valid on the target.
      - name: Build Bench Payload
        run: |
          ./scripts/build-bench-payload.sh \
            --distro "${{ matrix.distro }}" \
            --frappe-branch version-16 \
            --apps erpnext \
            --engine docker \
            --output ./dist

      - name: Build DEB Package
        if: matrix.format == 'deb'
        run: ./scripts/package-deb.sh --version "${{ steps.vars.outputs.version }}" --output ./dist

      # rpmbuild is not on the ubuntu runner, and the spec's %files must be
      # evaluated by the same rpm that will install the package.
      - name: Build RPM Package
        if: matrix.format == 'rpm'
        run: |
          docker run --rm -v "$PWD":/src -w /src "${{ matrix.distro }}" \
            sh -c 'command -v dnf >/dev/null && dnf -y install rpm-build tar findutils || \
                   yum -y install rpm-build tar findutils; \
                   ./scripts/package-rpm.sh --version "${{ steps.vars.outputs.version }}" --output ./dist'
          sudo chown -R "$USER" dist

      # A package that installs cleanly and then fails to run is the worst
      # outcome, and it is exactly what the previous .deb did. Install it in a
      # clean container and check that the services come up.
      - name: Smoke Test
        run: ./scripts/test-native-package.sh --distro "${{ matrix.distro }}" --engine docker

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ steps.vars.outputs.slug }}
          path: |
            dist/*.deb
            dist/*.rpm

  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap Package
        run: |
          mkdir -p dist
          snapcraft pack --output=dist/frappista-bench_amd64.snap

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: dist/*.snap

  publish-release:
    name: Publish Release Artifacts
    needs: [build-native, build-snap]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_snap_store == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.snap' \) \
            -exec mv -t dist/ {} +
          ls -lh dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.snap
          title: Frappista Package Release ${{ github.ref_name }}
          body: |
            Frappe Bench & ERPNext as native packages.

            The `.deb` and `.rpm` builds are **distribution-specific**: the
            virtualenv links against that release's python and OpenSSL. Pick the
            file matching your distribution. The `.snap` bundles everything and
            runs anywhere with `snapd`.

            ### Debian / Ubuntu
            ```bash
            sudo apt install ./frappista_*~ubuntu2404_amd64.deb
            sudo frappista-setup --site dev.localhost --admin-password admin
            ```

            ### Fedora / RHEL / Rocky
            ```bash
            sudo dnf install ./frappista-*.x86_64.rpm
            sudo frappista-setup --site dev.localhost --admin-password admin
            ```

            ### Snap
            ```bash
            sudo snap install frappista --classic
            sudo snap alias frappista.bench bench
            ```

            See `docs/native-install.md` and `docs/snap-install.md`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/frappista-bench_amd64.snap
          release: 16/stable

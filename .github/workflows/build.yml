name: Build Packages

# Three triggers:
#
#   1. Push to main (path-filtered) — selective build: only the snap or deb
#      package whose source files actually changed is rebuilt. A snap-only edit
#      never queues a 2-hour deb build, and vice versa.
#
#   2. Tags (v*) — full release build: all snaps (vybench + vypgbench), all deb
#      distros, arm64 included. Publishes snaps to their store entries when
#      `publish_snap` is true.
#      NOTE: the `paths` filter below also applies to tag pushes. Release tags
#      target commits that change packaging code, so this is always satisfied.
#      Use `workflow_dispatch` to force a full build if not.
#
#   3. workflow_dispatch — manual trigger; `force_full=true` rebuilds everything
#      regardless of what changed.
#
# Iterate locally with scripts/build-bench-payload.sh -- it is the same code path.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'snap/snapcraft.yaml'          # vybench (mariadb)
      - 'snap/snapcraft.postgres.yaml' # vypgbench (postgres)
      - 'snap/local/**'               # shared snap wrappers — triggers both snaps
      - 'snap/hooks/**'               # shared snap hooks — triggers both snaps
      - 'scripts/build-bench-payload.sh'
      - 'scripts/package-deb.sh'
      - 'scripts/package-rpm.sh'
      - 'scripts/lib/**'
      - 'scripts/templates/**'
      - 'packaging/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (default: taken from the built frappe)'
        required: false
        default: ''
      include_arm64:
        description: 'Also build arm64 (needs Team+ for private repos)'
        type: boolean
        required: false
        default: false
      publish_snap:
        description: 'Publish the snap to the Snap Store'
        type: boolean
        required: false
        default: false
      force_full:
        description: 'Build all packages regardless of what changed'
        type: boolean
        required: false
        default: true

# A second tag push should not leave two 2-hour runs racing each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # What changed?
  # Always runs (never skipped): a skipped dependency breaks downstream matrix
  # expansion on workflow_dispatch/tags even when Plan itself succeeds. On push
  # to main we path-filter; on tags / workflow_dispatch we mark everything true.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      snap_mariadb: ${{ steps.flags.outputs.snap_mariadb }}
      snap_postgres: ${{ steps.flags.outputs.snap_postgres }}
      deb: ${{ steps.flags.outputs.deb }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        with:
          filters: |
            snap_mariadb:
              - 'snap/snapcraft.yaml'
              - 'snap/local/**'
              - 'snap/hooks/**'
            snap_postgres:
              - 'snap/snapcraft.postgres.yaml'
              - 'snap/local/**'
              - 'snap/hooks/**'
            deb:
              - 'scripts/build-bench-payload.sh'
              - 'scripts/package-deb.sh'
              - 'scripts/package-rpm.sh'
              - 'scripts/lib/**'
              - 'scripts/templates/**'
              - 'packaging/**'
      - id: flags
        run: |
          FORCE="${{ inputs.force_full == true }}"
          if [ "$FORCE" = "true" ] || \
             [ "${{ github.event_name }}" != "push" ] || \
             [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            {
              echo "snap_mariadb=true"
              echo "snap_postgres=true"
              echo "deb=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "snap_mariadb=${{ steps.filter.outputs.snap_mariadb }}"
              echo "snap_postgres=${{ steps.filter.outputs.snap_postgres }}"
              echo "deb=${{ steps.filter.outputs.deb }}"
            } >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Compute which packages to build and on which runners.
  # ---------------------------------------------------------------------------
  matrix:
    name: Plan
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      snap: ${{ steps.plan.outputs.snap }}
      deb: ${{ steps.plan.outputs.deb }}
      has_snap: ${{ steps.plan.outputs.has_snap }}
      has_deb: ${{ steps.plan.outputs.has_deb }}
    steps:
      - id: plan
        run: |
          # Where arm64 builds run. GitHub's own arm64 runners require Team or
          # above for private repositories; on Free the label never resolves and
          # the job queues forever instead of failing. Point ARM64_RUNNER at a
          # self-hosted runner to avoid that -- e.g. a Hetzner CAX instance,
          # which is arm64 (Ampere) and costs less than the plan upgrade:
          #
          #   gh variable set ARM64_RUNNER --repo vyogotech/vybench \
          #     --body '["self-hosted","linux","ARM64"]'
          #
          # The value is a JSON array of labels, or a single label string.
          ARM_RUNNER='${{ vars.ARM64_RUNNER }}'
          [ -n "$ARM_RUNNER" ] || ARM_RUNNER='"ubuntu-24.04-arm"'
          case "$ARM_RUNNER" in '['*|'"'*) ;; *) ARM_RUNNER="\"$ARM_RUNNER\"" ;; esac

          BUILD_MARIADB="${{ needs.changes.outputs.snap_mariadb }}"
          BUILD_POSTGRES="${{ needs.changes.outputs.snap_postgres }}"
          BUILD_DEB="${{ needs.changes.outputs.deb }}"

          # Include arm64 entries on tag releases or when explicitly requested.
          FULL_ARCH=false
          if [ "${{ inputs.include_arm64 }}" = "true" ] || \
             [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            FULL_ARCH=true
          fi

          # Build snap matrix -- one entry per (snap, arch) combination.
          SNAP_ENTRIES=""
          if [ "$BUILD_MARIADB" = "true" ]; then
            SNAP_ENTRIES="${SNAP_ENTRIES:+$SNAP_ENTRIES,}{\"arch\":\"amd64\",\"runner\":\"ubuntu-24.04\",\"file\":\"snap/snapcraft.yaml\",\"flavor\":\"mariadb\"}"
            if [ "$FULL_ARCH" = "true" ]; then
              SNAP_ENTRIES="${SNAP_ENTRIES},{\"arch\":\"arm64\",\"runner\":$ARM_RUNNER,\"file\":\"snap/snapcraft.yaml\",\"flavor\":\"mariadb\"}"
            fi
          fi
          if [ "$BUILD_POSTGRES" = "true" ]; then
            SNAP_ENTRIES="${SNAP_ENTRIES:+$SNAP_ENTRIES,}{\"arch\":\"amd64\",\"runner\":\"ubuntu-24.04\",\"file\":\"snap/snapcraft.postgres.yaml\",\"flavor\":\"postgres\"}"
            if [ "$FULL_ARCH" = "true" ]; then
              SNAP_ENTRIES="${SNAP_ENTRIES},{\"arch\":\"arm64\",\"runner\":$ARM_RUNNER,\"file\":\"snap/snapcraft.postgres.yaml\",\"flavor\":\"postgres\"}"
            fi
          fi
          SNAP="[${SNAP_ENTRIES}]"

          # Build deb matrix.
          DEB_ENTRIES=""
          if [ "$BUILD_DEB" = "true" ]; then
            DEB_ENTRIES="{\"distro\":\"ubuntu:24.04\",\"runner\":\"ubuntu-24.04\"},{\"distro\":\"debian:12\",\"runner\":\"ubuntu-24.04\"}"
            if [ "$FULL_ARCH" = "true" ]; then
              DEB_ENTRIES="${DEB_ENTRIES},{\"distro\":\"ubuntu:24.04\",\"runner\":$ARM_RUNNER}"
            fi
          fi
          DEB="[${DEB_ENTRIES}]"

          # Fail loudly on malformed JSON: fromJSON on a bad string yields an
          # empty matrix and therefore no jobs, with nothing in the log.
          python3 -c "import json,sys; json.loads(sys.argv[1])" "$SNAP"
          python3 -c "import json,sys; json.loads(sys.argv[1])" "$DEB"

          # Simple boolean gates are reliable across skipped/always jobs;
          # keep the JSON matrices as single-line outputs (works for amd64+arm64).
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          if [ "$SNAP" = "[]" ]; then echo "has_snap=false" >> "$GITHUB_OUTPUT"; else echo "has_snap=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$DEB" = "[]" ]; then echo "has_deb=false" >> "$GITHUB_OUTPUT"; else echo "has_deb=true" >> "$GITHUB_OUTPUT"; fi
          echo "snap matrix: $SNAP"
          echo "deb  matrix: $DEB"

  # ---------------------------------------------------------------------------
  # .deb -- one job per distribution, runs concurrently with snap jobs.
  # Skipped when nothing deb-relevant changed (matrix outputs empty array).
  # ---------------------------------------------------------------------------
  deb:
    name: deb · ${{ matrix.distro }} · ${{ matrix.runner }}
    needs: matrix
    if: ${{ needs.matrix.outputs.has_deb == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # One distribution failing must not cancel the others; a partial set of
      # artefacts is far more useful than none when a build breaks.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.deb) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Slug
        id: s
        run: |
          echo "slug=$(echo '${{ matrix.distro }}' | tr ':' '-')-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Cache pip and yarn
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: deb-${{ matrix.distro }}-${{ matrix.runner }}-${{ hashFiles('scripts/build-bench-payload.sh') }}
          restore-keys: |
            deb-${{ matrix.distro }}-${{ matrix.runner }}-

      - name: Resolve the pinned CPython version
        id: py
        run: |
          # Parsed from the build script rather than repeated here: a hardcoded
          # version in the cache key would keep serving the previous interpreter
          # after a bump, and the mismatch would not show up until runtime.
          v="$(sed -n 's/^PYTHON_VERSION="\([^"]*\)".*/\1/p' scripts/build-bench-payload.sh | head -1)"
          [ -n "$v" ] || { echo "::error::could not parse PYTHON_VERSION from scripts/build-bench-payload.sh"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "cpython $v"

      # Separate from the pip/yarn cache above, which is keyed on this script's
      # hash and so is discarded on every edit to it. The interpreter takes
      # minutes to compile and only changes when PYTHON_VERSION does.
      #
      # No restore-keys: the interpreter links against the distro's OpenSSL and
      # libffi, so a prefix match across distro or arch would hand back an ABI
      # -incompatible build. An exact hit or a rebuild, nothing in between.
      - name: Cache the compiled CPython
        uses: actions/cache@v4
        with:
          path: .build-cache-python
          key: cpython-${{ steps.py.outputs.version }}-${{ matrix.distro }}-${{ runner.arch }}

      # Builds the bench at /opt/frappe-bench inside a container of the target
      # distribution -- the same path the package installs to, which is what keeps
      # pyvenv.cfg and the sites/assets symlinks valid on the target machine.
      - name: Build bench payload
        run: |
          ./scripts/build-bench-payload.sh \
            --distro "${{ matrix.distro }}" \
            --frappe-branch version-16 \
            --apps erpnext \
            --engine docker \
            --output ./dist

      - name: Build .deb
        run: |
          ARGS=(--output ./dist)
          [ -n "${{ inputs.version }}" ] && ARGS+=(--version "${{ inputs.version }}")
          ./scripts/package-deb.sh "${ARGS[@]}"

      # A package that installs cleanly and then fails to run is the worst
      # outcome, and is exactly what the .deb this project replaced used to do.
      # Install it in a clean systemd container and assert the services come up.
      - name: Verify in a clean container
        run: ./scripts/test-native-package.sh --distro "${{ matrix.distro }}" --engine docker

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ steps.s.outputs.slug }}
          path: dist/*.deb
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # snap -- concurrent with the .deb jobs.
  # Skipped when nothing snap-relevant changed (matrix outputs empty array).
  # The flavor field drives the artifact name: mariadb → vybench, postgres → vypgbench.
  # ---------------------------------------------------------------------------
  snap:
    name: snap · ${{ matrix.flavor }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: matrix
    if: ${{ needs.matrix.outputs.has_snap == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.snap) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Snapcraft
        uses: actions/cache@v4
        with:
          path: ~/.cache/snapcraft
          key: snap-${{ matrix.flavor }}-${{ matrix.arch }}-${{ hashFiles(matrix.file) }}
          restore-keys: |
            snap-${{ matrix.flavor }}-${{ matrix.arch }}-

      # snapcore/action-build only accepts `path` (project dir), NOT a
      # snapcraft-file input. A bogus `snapcraft-file:` is ignored and every
      # matrix cell silently builds snap/snapcraft.yaml → name: vybench.
      # That published vypgbench builds into the vybench store (rev 18).
      # Stage the selected recipe as the canonical snap/snapcraft.yaml.
      - name: Stage snapcraft recipe
        run: |
          set -euo pipefail
          echo "Using ${{ matrix.file }} as snap/snapcraft.yaml"
          cp "${{ matrix.file }}" snap/snapcraft.yaml
          # Prove the staged name matches the matrix flavor before we burn a build.
          staged="$(awk '/^name:/{print $2; exit}' snap/snapcraft.yaml)"
          case "${{ matrix.flavor }}" in
            mariadb)  want=vybench ;;
            postgres) want=vypgbench ;;
            *) echo "::error::unknown flavor ${{ matrix.flavor }}"; exit 1 ;;
          esac
          if [ "$staged" != "$want" ]; then
            echo "::error::staged snap name '$staged' != expected '$want' for flavor ${{ matrix.flavor }}"
            exit 1
          fi
          echo "staged name=$staged (ok)"

      # Canonical's official action. It provisions LXD correctly, which the
      # previous hand-rolled setup could not: `usermod -aG lxd $USER` followed by
      # `newgrp lxd` inside one `run:` step cannot affect later steps, so
      # snapcraft always came back with "LXD requires additional permissions".
      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: .
          # Omits snap/manifest.yaml. The store uses it to flag vulnerable
          # stage-packages, but it also enumerates everything the snap was built
          # from -- which this being a private, commercial artefact argues against.
          build-info: false

      - name: Assert packed snap name
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq squashfs-tools
          SNAP="${{ steps.build.outputs.snap }}"
          case "${{ matrix.flavor }}" in
            mariadb)  want=vybench ;;
            postgres) want=vypgbench ;;
          esac
          # meta/snap.yaml inside the squashfs is what the store uses.
          got="$(unsquashfs -cat "$SNAP" meta/snap.yaml | awk '/^name:/{print $2; exit}')"
          echo "packed=$SNAP store-name=$got want=$want"
          if [ "$got" != "$want" ]; then
            echo "::error::refusing to publish: snap name is '$got', expected '$want'"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 30
          if-no-files-found: error

      # Publish to the Snap Store. Each snap has its own store entry:
      #   mariadb flavor → vybench (stable v16)
      #   postgres flavor → vypgbench (develop / PostgreSQL)
      # Channel is 'edge' for manual publish and tag releases; promote to
      # 'stable' through the store dashboard after validation.
      - name: Publish snap to Snap Store
        if: inputs.publish_snap || startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge

  # ---------------------------------------------------------------------------
  # release -- only once every build above has succeeded on a tag push.
  # Uses `if: always()` so a skipped deb or snap (empty matrix on a
  # snap-only tag) does not block the release job.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [matrix, deb, snap]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Need a full history so the follow-up push can fast-forward main.
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.snap' \) -exec mv -t dist/ {} +

          # The packages are NOT GPG-signed, so checksums are the only integrity
          # check a downloader has. Publish them alongside, and generate from
          # inside dist/ so the file lists bare names that `sha256sum -c` can
          # resolve next to the downloads.
          ( cd dist && sha256sum ./*.deb ./*.snap > SHA256SUMS )
          cat dist/SHA256SUMS
          ls -lh dist

      # Homebrew formulas must pin url+sha256. Compute the digest of this tag's
      # GitHub archive and write it into brew/Formula/vybench.rb on main so a
      # tap PR can copy a correct formula (brew install does not hash on the fly).
      - name: Update Homebrew formula sha256 for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/update-brew-sha256.sh
          ./scripts/update-brew-sha256.sh "$TAG"
          if git diff --quiet -- brew/Formula/vybench.rb; then
            echo "formula already up to date for $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brew/Formula/vybench.rb
          git commit -m "chore(brew): pin sha256 for ${TAG}"
          git push origin HEAD:main

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body: |
            Frappe v16 / ERPNext as installable packages.

            ### Snaps

            | Snap | Database | Install |
            | :--- | :--- | :--- |
            | `vybench` | MariaDB (v16 stable) | `sudo snap install vybench` |
            | `vypgbench` | PostgreSQL (develop) | `sudo snap install vypgbench` |

            ### Native packages (.deb)

            The `.deb` builds are **distribution-specific** — each bundles a
            CPython 3.14 compiled against that release's own OpenSSL and sqlite,
            so they are not interchangeable:

            | File | For |
            | :--- | :--- |
            | `vybench_*~ubuntu2404_*.deb` | Ubuntu 24.04 |
            | `vybench_*~debian12_*.deb` | Debian 12 |

            ```bash
            sudo apt install ./vybench_*~ubuntu2404_amd64.deb
            sudo vybench-setup --site dev.localhost --admin-password admin
            ```

            ### Verify your download

            These packages are **not GPG-signed** — check them against the
            published digest:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            See `docs/native-install.md` and `docs/snap-install.md`.
